<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430"><rect width="100%" height="100%" fill="#fbfbfd"/><text x="30" y="35" font-size="24" font-family="Arial" font-weight="bold" fill="#183153">RTL-to-GDSII Implementation Flow (Conceptual)</text><g font-family="Arial" font-size="16" text-anchor="middle" fill="#183153" stroke-width="2"><rect x="40" y="80" width="200" height="55" rx="8" fill="#dceeff" stroke="#2463a6"/><text x="140" y="114" stroke="none">RTL + Testbench</text><rect x="320" y="80" width="200" height="55" rx="8" fill="#dff4e4" stroke="#26834a"/><text x="420" y="114" stroke="none">Simulation</text><rect x="600" y="80" width="200" height="55" rx="8" fill="#fff0d8" stroke="#b86b00"/><text x="700" y="114" stroke="none">Synthesis</text><rect x="880" y="80" width="180" height="55" rx="8" fill="#f0e4ff" stroke="#7747a8"/><text x="970" y="114" stroke="none">Floorplan</text><rect x="880" y="205" width="180" height="55" rx="8" fill="#fce1ef" stroke="#a83270"/><text x="970" y="239" stroke="none">Placement + CTS</text><rect x="600" y="205" width="200" height="55" rx="8" fill="#dceeff" stroke="#2463a6"/><text x="700" y="239" stroke="none">Routing + Extraction</text><rect x="320" y="205" width="200" height="55" rx="8" fill="#ffe2e2" stroke="#b33a3a"/><text x="420" y="239" stroke="none">Multi-corner STA</text><rect x="40" y="205" width="200" height="55" rx="8" fill="#e4e7eb" stroke="#555"/><text x="140" y="239" stroke="none">DRC/LVS + GDSII</text></g><g stroke="#444" stroke-width="2" fill="none"><path d="M240 107 H315 M520 107 H595 M800 107 H875 M970 135 V200 M880 232 H805 M600 232 H525 M320 232 H245"/></g><text x="30" y="330" font-family="Arial" font-size="15" fill="#555">Conceptual flow only. Tool-specific reports and final GDS must be generated by running a configured PDK flow.</text><text x="30" y="360" font-family="Arial" font-size="15" fill="#555">STA corner examples: TT / SS / FF / SF / FS (only where supported by the selected library).</text></svg>